<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Recurring Routine Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-yellow: #eab308;
            --border-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-group h1 {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-group p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .view-btn, .action-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn.primary {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .view-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .live-status {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Weekly View */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .day-column {
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-column.today {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
        }

        .day-header {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .today .day-header {
            color: var(--accent-blue);
        }

        .routine-card {
            background: var(--bg-card);
            border-left: 4px solid var(--accent-blue);
            padding: 10px 12px;
            border-radius: 8px;
            position: relative;
            transition: transform 0.2s ease;
        }

        .routine-card.active-now {
            background: rgba(59, 130, 246, 0.25);
            border-color: var(--accent-blue);
            outline: 2px solid var(--accent-blue);
        }

        .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            display: none;
        }

        .routine-card:hover .delete-btn {
            display: block;
        }

        .delete-btn:hover {
            color: var(--accent-red);
        }

        .routine-time {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .routine-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .routine-desc {
            font-size: 0.72rem;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        /* Daily Hourly View */
        .hourly-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .hour-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
        }

        .hour-row.active-hour {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--accent-blue);
        }

        .hour-time {
            width: 60px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .hour-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Modal Form */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-content h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select, .form-group textarea {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .days-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .days-checkboxes label {
            font-size: 0.75rem;
            background: var(--bg-card);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .badge-blue { border-left-color: var(--accent-blue); }
        .badge-green { border-left-color: var(--accent-green); }
        .badge-purple { border-left-color: var(--accent-purple); }
        .badge-red { border-left-color: var(--accent-red); }
        .badge-orange { border-left-color: var(--accent-orange); }
        .badge-yellow { border-left-color: var(--accent-yellow); }

        footer {
            margin-top: 20px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>🗓️ Dynamic Recurring Routine Dashboard</h1>
            <p>Ozi’s HQ/OS — Module #1 Dynamic Routines Engine</p>
        </div>

        <div class="controls">
            <button class="action-btn primary" onclick="openModal()">➕ Yeni Rutin Ekle</button>
            <button class="view-btn active" id="btnWeekly" onclick="switchView('weekly')">📅 Haftalık Görünüm</button>
            <button class="view-btn" id="btnDaily" onclick="switchView('daily')">⏱️ Günlük Saatlik Görünüm</button>

            <div class="live-status">
                <div class="pulse-dot"></div>
                <span id="currentStatusText">Active Slot: Checking...</span>
            </div>
        </div>
    </header>

    <!-- Weekly View Container -->
    <div class="grid-container" id="weeklyView"></div>

    <!-- Daily Hourly View Container -->
    <div class="hourly-container" id="dailyView" style="display: none;"></div>

    <!-- Add Routine Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>➕ Yeni Rutin Ekle</h3>
            <div class="form-group">
                <label>Rutin Adı</label>
                <input type="text" id="inputName" placeholder="Örn: Exercise & Gym">
            </div>
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label>Başlangıç Saati</label>
                    <input type="text" id="inputStart" placeholder="08:00">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Bitiş Saati</label>
                    <input type="text" id="inputEnd" placeholder="09:30">
                </div>
            </div>
            <div class="form-group">
                <label>Aktif Günler</label>
                <div class="days-checkboxes">
                    <label><input type="checkbox" value="Monday" checked> Mon</label>
                    <label><input type="checkbox" value="Tuesday" checked> Tue</label>
                    <label><input type="checkbox" value="Wednesday" checked> Wed</label>
                    <label><input type="checkbox" value="Thursday" checked> Thu</label>
                    <label><input type="checkbox" value="Friday" checked> Fri</label>
                    <label><input type="checkbox" value="Saturday"> Sat</label>
                    <label><input type="checkbox" value="Sunday"> Sun</label>
                </div>
            </div>
            <div class="form-group">
                <label>Renk</label>
                <select id="inputColor">
                    <option value="blue">Mavi (Blue)</option>
                    <option value="orange" selected>Turuncu (Orange)</option>
                    <option value="green">Yeşil (Green)</option>
                    <option value="purple">Mor (Purple)</option>
                    <option value="red">Kırmızı (Red)</option>
                    <option value="yellow">Sarı (Yellow)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Açıklama</label>
                <textarea id="inputDesc" rows="2" placeholder="Yapay zeka için görev yönlendirme notu..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
                <button class="action-btn" onclick="closeModal()">İptal</button>
                <button class="action-btn primary" onclick="saveNewRoutine()">Kaydet & Ekle</button>
            </div>
        </div>
    </div>

    <footer>
        Synced Live with Notion Routines Database • Supports Mobile & Desktop Native Push Notifications
    </footer>

    <script>
        // Live Routines Data (Includes Chores added by User in Notion)
        let routines = [
            {
                name: "Deep Work Session",
                days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
                startTime: "11:30",
                endTime: "15:00",
                color: "blue",
                description: "Existing projects, job interview preps, architecture & coding."
            },
            {
                name: "Chores",
                days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                startTime: "11:30",
                endTime: "14:00",
                color: "orange",
                description: "Home Cleaning, Food Prep, Shop for groceries, etc…"
            },
            {
                name: "Trading & Market Analysis",
                days: ["Tuesday", "Wednesday", "Thursday", "Friday"],
                startTime: "15:30",
                endTime: "17:00",
                color: "green",
                description: "Financial market research & trading execution (Mondays excluded)."
            },
            {
                name: "Rest & Skill Learning",
                days: ["Saturday", "Sunday"],
                startTime: "18:00",
                endTime: "20:00",
                color: "purple",
                description: "Personal time, skill learning, technical reading & recharge."
            }
        ];

        const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        let currentView = 'weekly';

        function openModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; }

        function saveNewRoutine() {
            const name = document.getElementById('inputName').value.trim();
            const startTime = document.getElementById('inputStart').value.trim();
            const endTime = document.getElementById('inputEnd').value.trim();
            const color = document.getElementById('inputColor').value;
            const description = document.getElementById('inputDesc').value.trim();

            const checkedDays = Array.from(document.querySelectorAll('.days-checkboxes input:checked')).map(c => c.value);

            if (!name || !startTime || !endTime) {
                alert('Lütfen Rutin Adı, Başlangıç ve Bitiş saatini doldurun!');
                return;
            }

            routines.push({ name, days: checkedDays, startTime, endTime, color, description });
            closeModal();
            renderDashboard();
        }

        function deleteRoutine(index) {
            if (confirm(`'${routines[index].name}' rutinini silmek istediğinize emin misiniz?`)) {
                routines.splice(index, 1);
                renderDashboard();
            }
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('btnWeekly').classList.toggle('active', view === 'weekly');
            document.getElementById('btnDaily').classList.toggle('active', view === 'daily');

            document.getElementById('weeklyView').style.display = view === 'weekly' ? 'grid' : 'none';
            document.getElementById('dailyView').style.display = view === 'daily' ? 'flex' : 'none';

            renderDashboard();
        }

        function renderDashboard() {
            const now = new Date();
            const currentDayIndex = (now.getDay() + 6) % 7; // Monday = 0
            const todayName = daysOfWeek[currentDayIndex];
            const currentHours = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentTimeVal = currentHours * 60 + currentMinutes;

            let activeSlotFound = null;

            // Render Weekly View
            const weeklyContainer = document.getElementById('weeklyView');
            weeklyContainer.innerHTML = '';

            daysOfWeek.forEach(day => {
                const dayCol = document.createElement('div');
                dayCol.className = `day-column ${day === todayName ? 'today' : ''}`;

                const header = document.createElement('div');
                header.className = 'day-header';
                header.innerHTML = `<span>${day}</span>${day === todayName ? '<span>(Bugün)</span>' : ''}`;
                dayCol.appendChild(header);

                const dayRoutines = routines.filter(r => r.days.includes(day));

                if (dayRoutines.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.color = 'var(--text-secondary)';
                    empty.style.fontSize = '0.78rem';
                    empty.style.padding = '8px 0';
                    empty.innerText = 'Sabit rutin yok';
                    dayCol.appendChild(empty);
                } else {
                    dayRoutines.sort((a,b) => a.startTime.localeCompare(b.startTime)).forEach(r => {
                        const rIndex = routines.indexOf(r);
                        const card = document.createElement('div');
                        card.className = `routine-card badge-${r.color.toLowerCase()}`;

                        const [startH, startM] = r.startTime.split(':').map(Number);
                        const [endH, endM] = r.endTime.split(':').map(Number);
                        const startVal = startH * 60 + startM;
                        const endVal = endH * 60 + endM;

                        if (day === todayName && currentTimeVal >= startVal && currentTimeVal <= endVal) {
                            card.classList.add('active-now');
                            activeSlotFound = `${r.name} (${r.startTime} - ${r.endTime})`;
                        }

                        card.innerHTML = `
                            <button class="delete-btn" onclick="deleteRoutine(${rIndex})">✕</button>
                            <div class="routine-time">⏱️ ${r.startTime} - ${r.endTime}</div>
                            <div class="routine-title">${r.name}</div>
                            <div class="routine-desc">${r.description}</div>
                        `;
                        dayCol.appendChild(card);
                    });
                }
                weeklyContainer.appendChild(dayCol);
            });

            // Render Daily Hourly View
            const dailyContainer = document.getElementById('dailyView');
            dailyContainer.innerHTML = `<h3 style="font-size: 1rem; color: var(--accent-blue); margin-bottom: 12px;">📅 Bugünün Saatlik Çizelgesi (${todayName})</h3>`;

            const todayRoutines = routines.filter(r => r.days.includes(todayName));

            for (let hour = 0; hour < 24; hour++) {
                const hourStr = hour.toString().padStart(2, '0') + ':00';
                const hourStartVal = hour * 60;
                const hourEndVal = (hour + 1) * 60;

                const row = document.createElement('div');
                row.className = `hour-row ${currentHours === hour ? 'active-hour' : ''}`;

                const timeLabel = document.label = document.createElement('div');
                timeLabel.className = 'hour-time';
                timeLabel.innerText = hourStr;
                row.appendChild(timeLabel);

                const content = document.createElement('div');
                content.className = 'hour-content';

                const matching = todayRoutines.filter(r => {
                    const [sH, sM] = r.startTime.split(':').map(Number);
                    const [eH, eM] = r.endTime.split(':').map(Number);
                    const sVal = sH * 60 + sM;
                    const eVal = eH * 60 + eM;
                    return (sVal < hourEndVal && eVal > hourStartVal);
                });

                if (matching.length > 0) {
                    matching.forEach(r => {
                        const tag = document.createElement('div');
                        tag.className = `routine-card badge-${r.color.toLowerCase()}`;
                        tag.style.margin = '0';
                        tag.style.padding = '6px 10px';
                        tag.innerHTML = `<strong>${r.name}</strong> <span style="color: var(--text-secondary); font-size: 0.75rem;">(${r.startTime} - ${r.endTime})</span>`;
                        content.appendChild(tag);
                    });
                } else {
                    const free = document.createElement('span');
                    free.style.color = 'var(--text-secondary)';
                    free.style.fontSize = '0.75rem';
                    free.innerText = '— Free Time Window —';
                    content.appendChild(free);
                }

                row.appendChild(content);
                dailyContainer.appendChild(row);
            }

            // Update Header Live Status
            const statusText = document.getElementById('currentStatusText');
            if (activeSlotFound) {
                statusText.innerText = `Active Now: ${activeSlotFound}`;
            } else {
                statusText.innerText = `Current Time: ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} (Serbest Zaman)`;
            }
        }

        renderDashboard();
        setInterval(renderDashboard, 30000);
    </script>
</body>
</html>
